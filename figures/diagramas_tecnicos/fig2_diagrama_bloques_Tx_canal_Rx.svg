<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" width="1500" height="760" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker>
  </defs>
  <rect width="1500" height="760" fill="#fcfcfb"/>
  <text x="750" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">Diagrama técnico del sistema Tx – Canal – Rx (Fase 1–2, simulación en GNU Radio)</text>
  <text x="750" y="64" text-anchor="middle" font-size="14" fill="#52514e">GRC base: Modulaciones_basadas_en_constelaciones_AWGN.grc  →  copias: Grupo03_S4_QPSK_AWGN.grc y Grupo03_S4_16QAM_AWGN.grc</text>

  <!-- Bandas de etapa -->
  <rect x="20" y="92" width="905" height="300" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-dasharray="6 4"/>
  <text x="36" y="116" font-size="15" font-weight="bold" fill="#2a78d6">TRANSMISOR (Tx)</text>
  <rect x="940" y="92" width="175" height="300" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-dasharray="6 4"/>
  <text x="954" y="116" font-size="15" font-weight="bold" fill="#eb6834">CANAL</text>
  <rect x="1130" y="92" width="350" height="300" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-dasharray="6 4"/>
  <text x="1146" y="116" font-size="15" font-weight="bold" fill="#52514e">OBSERVACIÓN / Rx</text>

  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <!-- bloques Tx -->
    <rect x="36" y="180" width="150" height="110" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="111" y="212" font-weight="bold">Random Source</text><text x="111" y="234">bits 0/1</text><text x="111" y="254" fill="#52514e" font-size="11">byte, min 0, max 2</text>

    <rect x="214" y="180" width="160" height="110" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="294" y="208" font-weight="bold">Pack K Bits (8)</text><text x="294" y="226" font-weight="bold">+ Unpack (bps)</text><text x="294" y="250">agrupa k = log₂M bits</text><text x="294" y="270" fill="#52514e" font-size="11">MSB primero</text>

    <rect x="402" y="164" width="190" height="142" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="3"/>
    <text x="497" y="190" font-weight="bold">Chunks to Symbols</text><text x="497" y="212">tabla_de_verdad_</text><text x="497" y="230">constelacion</text>
    <text x="497" y="256" fill="#2a78d6" font-size="12" font-weight="bold">MODIFICADO</text>
    <text x="497" y="276" font-size="11" fill="#52514e">QPSK: M=4, Es=1</text><text x="497" y="292" font-size="11" fill="#52514e">16QAM: M=16, Gray, ÷√10</text>

    <rect x="620" y="180" width="160" height="110" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="700" y="208" font-weight="bold">Interpolating</text><text x="700" y="226" font-weight="bold">FIR Filter</text><text x="700" y="250">h = [1]·Sps (rect.)</text><text x="700" y="270" fill="#52514e" font-size="11">interp = Sps = 8</text>

    <rect x="806" y="196" width="104" height="78" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="858" y="228" font-weight="bold">Throttle</text><text x="858" y="250" font-size="11" fill="#52514e">samp_rate</text>

    <!-- canal -->
    <circle cx="1027" cy="235" r="34" fill="#fcfcfb" stroke="#eb6834" stroke-width="3"/>
    <text x="1027" y="246" font-size="34" fill="#eb6834">+</text>
    <rect x="958" y="300" width="138" height="78" rx="8" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
    <text x="1027" y="324" font-weight="bold">Noise Source</text><text x="1027" y="344">Gaussiano complejo</text><text x="1027" y="364" fill="#eb6834" font-weight="bold">noise_amp</text>

    <!-- sinks -->
    <rect x="1190" y="140" width="270" height="60" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="1325" y="166" font-weight="bold">QT GUI Frequency Sink</text><text x="1325" y="186" font-size="11" fill="#52514e">PSD · FFT 1024 · BW = samp_rate</text>
    <rect x="1190" y="210" width="270" height="60" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="1325" y="236" font-weight="bold">QT GUI Constellation Sink</text><text x="1325" y="256" font-size="11" fill="#52514e">2048 muestras · ejes ±1.5 (MODIFICADO)</text>
    <rect x="1190" y="280" width="270" height="60" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5"/>
    <text x="1325" y="306" font-weight="bold">QT GUI Time Sink</text><text x="1325" y="326" font-size="11" fill="#52514e">envolvente compleja I(t), Q(t)</text>
  </g>
  <!-- conexiones -->
  <g stroke="#0b0b0b" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="186" y1="235" x2="212" y2="235"/>
    <line x1="374" y1="235" x2="400" y2="235"/>
    <line x1="592" y1="235" x2="618" y2="235"/>
    <line x1="780" y1="235" x2="804" y2="235"/>
    <line x1="910" y1="235" x2="991" y2="235"/>
    <line x1="1027" y1="300" x2="1027" y2="271"/>
    <path d="M1061,235 H1150 V170 H1188"/>
    <path d="M1150,235 V240 H1188"/>
    <path d="M1150,235 V310 H1188"/>
  </g>
  <g font-size="11" fill="#52514e" text-anchor="middle">
    <text x="199" y="226">bits</text><text x="387" y="216">índ.</text><text x="605" y="226">sím.</text><text x="792" y="226">fs</text>
    <text x="950" y="226">s(t)</text><text x="1098" y="262">r(t)</text>
  </g>
  <text x="1105" y="420" text-anchor="middle" font-size="12" fill="#52514e"></text>

  <!-- tabla de parámetros -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="20" y="420" width="700" height="318" rx="10" fill="#fcfcfb" stroke="#52514e"/>
    <text x="40" y="450" font-size="16" font-weight="bold">Parámetros del sistema (iguales para las dos modulaciones)</text>
    <g>
      <rect x="40" y="466" width="660" height="30" fill="#f1f0ec"/>
      <text x="56" y="486" font-weight="bold">Parámetro</text><text x="300" y="486" font-weight="bold">QPSK</text><text x="480" y="486" font-weight="bold">16QAM</text>
      <text x="56" y="522">M  /  k = log₂M</text><text x="300" y="522">4  /  2 bits</text><text x="480" y="522">16  /  4 bits</text>
      <text x="56" y="552">Rs (tasa de símbolos)</text><text x="300" y="552">32 ksym/s</text><text x="480" y="552">32 ksym/s</text>
      <text x="56" y="582">Rb = Rs · k</text><text x="300" y="582" font-weight="bold" fill="#2a78d6">64 kb/s</text><text x="480" y="582" font-weight="bold" fill="#eb6834">128 kb/s</text>
      <text x="56" y="612">Sps  /  fs = Rs · Sps</text><text x="300" y="612">8  /  256 kS/s</text><text x="480" y="612">8  /  256 kS/s</text>
      <text x="56" y="642">BW lóbulo principal (rect.)</text><text x="300" y="642">2·Rs = 64 kHz</text><text x="480" y="642">2·Rs = 64 kHz</text>
      <text x="56" y="672">BW con RRC β=0.35 (Guía 2)</text><text x="300" y="672">≈ 43.2 kHz</text><text x="480" y="672">≈ 43.2 kHz</text>
      <text x="56" y="702">Eficiencia espectral Rb/BW</text><text x="300" y="702">≈ 1.5 b/s/Hz</text><text x="480" y="702">≈ 3.0 b/s/Hz</text>
      <text x="56" y="728" font-size="11" fill="#52514e">Eficiencia calculada con BW ≈ 43.2 kHz (RRC). Con pulso rectangular: 1.0 y 2.0 b/s/Hz.</text>
    </g>
  </g>
  <!-- pruebas -->
  <g font-size="13" fill="#0b0b0b">
    <rect x="740" y="420" width="740" height="318" rx="10" fill="#fcfcfb" stroke="#52514e"/>
    <text x="760" y="450" font-size="16" font-weight="bold">Plan de pruebas: solo cambia noise_amp</text>
    <rect x="760" y="466" width="700" height="30" fill="#f1f0ec"/>
    <text x="776" y="486" font-weight="bold">Prueba</text><text x="930" y="486" font-weight="bold">noise_amp</text><text x="1070" y="486" font-weight="bold">Eb/N0 QPSK</text><text x="1240" y="486" font-weight="bold">Eb/N0 16QAM</text>
    <text x="776" y="522">A · Referencia</text><text x="930" y="522">0.00</text><text x="1070" y="522">∞ (sin ruido)</text><text x="1240" y="522">∞ (sin ruido)</text>
    <text x="776" y="552">B · Suave</text><text x="930" y="552">0.10</text><text x="1070" y="552">26.0 dB</text><text x="1240" y="552">23.0 dB</text>
    <text x="776" y="582">C · Media</text><text x="930" y="582">0.25</text><text x="1070" y="582">18.1 dB</text><text x="1240" y="582">15.1 dB</text>
    <text x="776" y="612">D · Fuerte</text><text x="930" y="612">0.50</text><text x="1070" y="612">12.0 dB</text><text x="1240" y="612">9.0 dB</text>
    <text x="760" y="652" font-size="12" fill="#52514e">Eb/N0 = Sps / (k · noise_amp²), con Es = 1 y potencia de ruido = noise_amp² por muestra.</text>
    <text x="760" y="676" font-size="12" fill="#52514e">Con el mismo ruido, 16QAM queda 3 dB por debajo en Eb/N0 (reparte Es entre 4 bits)</text>
    <text x="760" y="696" font-size="12" fill="#52514e">y además necesita ≈ 3.7 dB más que QPSK para la misma BER (puntos más cercanos).</text>
    <text x="760" y="720" font-size="12" fill="#52514e">Constantes en todas las pruebas: Rs, Sps, fs, pulso, tabla y semilla del ruido.</text>
  </g>
</svg>
